services:
  postgres:
    image: postgres:16
    container_name: siakad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: siakad
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "5432:5432"
    volumes:
      - siakad_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d siakad"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  siakad_postgres_data: